# SEC-20 - Secure CI/CD pipeline for the EVP app (Spring Boot backend + React frontend).
#
# Runs on every pull request to main and every push to main. Every job below is a
# REQUIRED status check in .github/branch-protection.json, so a pull request can only
# be merged when ALL of them pass AND a code owner has approved it.
name: security-pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # weekly re-scan: new CVEs appear in dependencies we did not change
  workflow_dispatch:       # "Run workflow" button on the Actions tab

# Least privilege: the token is read-only unless a job asks for more.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1a. Backend unit and API tests (JUnit, H2 database in PostgreSQL mode)
  backend-tests:
    name: Tests - backend (JUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      # The Maven wrapper (mvnw) pins the Maven version; git on Windows does not keep its run permission.
      - name: Make the Maven wrapper runnable
        working-directory: backend
        run: chmod +x mvnw
      - name: Backend tests
        working-directory: backend
        run: ./mvnw -B test

  # 1b. Frontend tests, XSS lint rules (SEC-07) and production build
  frontend-tests:
    name: Tests - frontend (Vitest, ESLint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  # 2a. Static analysis (SAST) - Semgrep
  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Semgrep's generic "ecb-cipher" rule also flags "RSA/ECB/...", which in Java means plain
      # single-block RSA (used by SEC-11 and SEC-15), not ECB chaining. It is replaced by our
      # own rule in .semgrep/evp-rules.yml, which still catches real ECB use (AES, DES ...).
      - name: Semgrep - fails the build on any finding
        run: >
          semgrep scan
          --config p/java --config p/typescript --config p/react --config p/secrets
          --config .semgrep/evp-rules.yml
          --exclude-rule java.lang.security.audit.crypto.ecb-cipher.ecb-cipher
          --metrics=off --error .

  # 2b. Static analysis (SAST) - CodeQL, results in the repository's Security tab
  codeql:
    name: SAST - CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # 3. SBOM - CycloneDX list of every package (and exact version) the app ships
  sbom:
    name: SBOM - CycloneDX
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend SBOM (runtime dependencies, no test-only libraries)
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom \
            -DoutputFormat=json -DoutputName=sbom-backend -DincludeTestScope=false
          cp target/sbom-backend.json ../sbom-backend.cdx.json
      - name: Frontend SBOM (packages shipped to the browser, no dev tools)
        working-directory: frontend
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@1.19.3 --omit dev --output-format JSON \
            --output-file ../sbom-frontend.cdx.json
      - name: Check both SBOMs are valid and complete
        run: python3 .github/scripts/check_sbom.py sbom-backend.cdx.json sbom-frontend.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: |
            sbom-backend.cdx.json
            sbom-frontend.cdx.json
          retention-days: 90

  # 4. Dependency scan - every package in the SBOMs against the OSV.dev vulnerability database
  dependency-scan:
    name: Dependency scan - OSV
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [sbom]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: sbom-cyclonedx
      - name: Fail on HIGH or CRITICAL vulnerabilities (unless reviewed in the allowlist)
        run: >
          python3 .github/scripts/osv_scan.py
          --allowlist .github/dependency-allowlist.txt
          sbom-backend.cdx.json sbom-frontend.cdx.json

  # 5. Secret scan - gitleaks over the WHOLE git history
  secret-scan:
    name: Secret scan - gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so a secret that was "deleted" later is still caught
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
      - name: Scan every commit - fails if a secret is found
        run: >
          ./gitleaks git --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore
          --redact --verbose --exit-code 1 .