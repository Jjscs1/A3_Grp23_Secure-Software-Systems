# SEC-19 transport security. Activate with: --spring.profiles.active=tls   (or add to the group's profile list)
server.port=8443
server.ssl.enabled=true
server.ssl.enabled-protocols=TLSv1.3
# TLS 1.3 suites are all AEAD; list explicitly so nothing weaker can ever be added by a default change
server.ssl.ciphers=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256
server.ssl.key-store-type=PKCS12
# Secrets are NEVER written here: they are read from the environment at start-up
server.ssl.key-store=${EVP_TLS_KEYSTORE}
server.ssl.key-store-password=${EVP_TLS_KEYSTORE_PASSWORD}
evp.tls.canonical-host=${EVP_PUBLIC_HOST:localhost:8443}
evp.tls.trust-forwarded-proto=false
# Database connection over TLS as well (PostgreSQL)
spring.datasource.url=${EVP_DB_URL}
spring.datasource.username=${EVP_DB_USER}
spring.datasource.password=${EVP_DB_PASSWORD}
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
