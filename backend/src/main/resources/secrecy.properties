# SEC-13: nothing may record who sent a ballot or what it contained.
# Behind a proxy, do NOT trust or log forwarded addresses on ballot routes.
server.forward-headers-strategy=none
# The container's own access log would record the client IP: switch it off (the app logs method/path/status/ms only).
server.tomcat.accesslog.enabled=false
spring.mvc.log-request-details=false
# Never enable Spring's request-payload logger.
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=OFF
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN
# Ballot database (separate schema, separate roles). Passwords come from the environment, never the repo:
#   EVP_BALLOT_DB_URL, EVP_BALLOT_DB_WRITER_PASSWORD, EVP_BALLOT_DB_COUNTER_PASSWORD
evp.ballot-db.writer-user=ballot_writer
evp.ballot-db.counter-user=ballot_counter
