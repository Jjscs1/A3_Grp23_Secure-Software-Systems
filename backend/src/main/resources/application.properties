spring.application.name=evp-backend

# Database (PostgreSQL). Secrets come from environment variables, never this file (SEC-19).
spring.datasource.url=${EVP_DB_URL:jdbc:postgresql://localhost:5432/evp}
spring.datasource.username=${EVP_DB_USER:evp}
spring.datasource.password=${EVP_DB_PASSWORD}
# Prototype only: Hibernate creates and updates tables. Use Flyway migrations for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Identity provider (SEC-01). JWKS is fetched lazily on the first authenticated request.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${EVP_JWKS_URI:http://localhost:8180/realms/evp/protocol/openid-connect/certs}

# Fail securely: no stack traces or exception messages in error responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# SEC-08: HMAC secret for the enrolment lookup key (base64, 32+ bytes): openssl rand -base64 32
evp.enrolment.lookup-secret=${EVP_LOOKUP_SECRET:}
evp.enrolment.allow-ephemeral-secret=false
evp.enrolment.min-response-ms=300

# SEC-11: election signing key, PKCS#8 PEM, kept outside the repo
evp.token.private-key-path=${EVP_TOKEN_KEY_PATH:}
evp.token.allow-ephemeral-key=false

# SEC-10: polling day, ISO date (age is measured on this day). Blank means today.
evp.election.day=${EVP_ELECTION_DAY:}
