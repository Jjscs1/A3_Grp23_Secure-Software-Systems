spring.application.name=evp-backend

# Local development server
server.address=127.0.0.1
server.port=8080

# PostgreSQL database
spring.datasource.url=${EVP_DB_URL:jdbc:postgresql://localhost:5432/evp}
spring.datasource.username=${EVP_DB_USER:evp}
spring.datasource.password=${EVP_DB_PASSWORD}

# Prototype schema management
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# SEC-01: Keycloak access-token validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${EVP_ISSUER_URI:http://localhost:8081/realms/evp}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${EVP_JWKS_URI:http://localhost:8081/realms/evp/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=evp-backend
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256

# Generic error responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# SEC-08: enrolment lookup
evp.enrolment.lookup-secret=${EVP_LOOKUP_SECRET:}
evp.enrolment.allow-ephemeral-secret=false
evp.enrolment.min-response-ms=300

# SEC-11: election signing key
evp.token.private-key-path=${EVP_TOKEN_KEY_PATH:}
evp.token.allow-ephemeral-key=false

# SEC-10: polling day; blank means today
evp.election.day=${EVP_ELECTION_DAY:}
# SEC-09: trust the socket peer, not arbitrary client-supplied forwarding headers.
server.forward-headers-strategy=none

# SEC-17: audit log signing key pair (Ed25519 PEM files), kept outside the repo
evp.audit.private-key-path=${EVP_AUDIT_KEY_PATH:}
evp.audit.public-key-path=${EVP_AUDIT_PUBLIC_KEY_PATH:}
evp.audit.allow-ephemeral-key=false

# SEC-18: results signing key pair (Ed25519 PEM files), kept outside the repo
  evp.results.private-key-path=${EVP_RESULTS_KEY_PATH:}
  evp.results.public-key-path=${EVP_RESULTS_PUBLIC_KEY_PATH:}
  evp.results.allow-ephemeral-key=false

#sec 06 : allow encrypted ballot enevelopes 
evp.validation.max-string-length=65536
