spring.application.name=backend

server.address=127.0.0.1
server.port=8080

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/evp
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/evp/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=evp-backend
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256