# Test profile: in-memory H2 in PostgreSQL mode, so tests need no database or Keycloak.
spring.datasource.url=jdbc:h2:mem:evp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# No secrets in the repo: the test profile generates random keys at startup.
evp.enrolment.allow-ephemeral-secret=true
evp.enrolment.min-response-ms=200

evp.token.allow-ephemeral-key=true
evp.election.day=2026-05-02
