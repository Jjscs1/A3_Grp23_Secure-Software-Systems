# Local demo only. One worker is required for the in-process atomic limiter.
worker_processes 1;
pid /tmp/evp-gateway.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    # Do not log URLs, query strings, credentials or authentication request bodies.
    access_log off;
    server_tokens off;
    lua_package_path "/etc/evp-gateway/?.lua;;";
    lua_code_cache on;
    client_body_buffer_size 64k;
    client_max_body_size 2m;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    resolver 127.0.0.11 ipv6=off valid=10s;
    server {
        listen 8080;
        server_name localhost;
        location / {
            access_by_lua_file /etc/evp-gateway/access.lua;
            # Use Docker DNS at request time, including after a Keycloak container restart.
            set $keycloak_upstream http://evp-keycloak-internal:8080;
            proxy_pass $keycloak_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host "localhost:8081";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host "localhost";
            proxy_set_header X-Forwarded-Port "8081";
            proxy_set_header X-Forwarded-Proto "http";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_redirect off;
        }
    }
}
