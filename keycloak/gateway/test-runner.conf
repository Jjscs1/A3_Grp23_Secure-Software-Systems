# Test-only process: no ports/listeners, no upstream connections, no Perl dependency.
worker_processes 1;
master_process off;
daemon off;
pid /tmp/evp-gateway-tests.pid;
error_log /dev/stderr notice;
events { worker_connections 16; }
http {
    access_log off;
    lua_package_path "/etc/evp-gateway/?.lua;;";
    init_by_lua_block {
        local ok, err = pcall(function()
            dofile("/etc/evp-gateway/tests.lua")
            dofile("/etc/evp-gateway/tests-access.lua")
        end)
        if not ok then
            io.stderr:write("Gateway test failure: " .. tostring(err) .. "\n")
            io.stderr:flush()
            os.exit(1)
        end
        io.stdout:flush()
        os.exit(0)
    }
}
